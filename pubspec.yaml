name: maqam_tuner
description: Microtonal tuner (12 / 24 / 53 divisions) for oud, saz, qanun, ney, violin and more.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  record: ^6.0.0
  audioplayers: ^6.1.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0E1B2E"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  web:
    generate: true
    image_path: "assets/icon/icon_foreground.png"
    background_color: "#0E1B2E"
    theme_color: "#0E1B2E"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
